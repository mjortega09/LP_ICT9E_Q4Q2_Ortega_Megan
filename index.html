<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<title>Score Analyzer</title>



</head>
<body style="background-color: #d1cdb3;">
	<br>
<center><h1 style="color:#949077">Score Analyzer! ⋆˙⟡</h1></center>
<center><h1 style="font-size: 12px;" style="color:#949077">Input your grades and click the button to analyze your grades.</h1></center>
<br>
	<center><img src="subs.png" width="900px" ></center>

	<center><input type="number" id="grade1" placeholder="Enter Science grade"> 
	<input type="number" id="grade2" placeholder="Enter Math grade">
	<input type="number" id="grade3" placeholder="Enter English grade"></center>

	<br>

	<center><button onclick="findGrade()">Analyze</button></center>
	<h2 id="result" class="text-center"></h2>

	<script>
		function findGrade() {

			let g1 = parseFloat(document.getElementById("grade1").value);
			let g2 = parseFloat(document.getElementById("grade2").value);
			let g3 = parseFloat(document.getElementById("grade3").value);

			let avg = (g1 + g2 + g3) / 3;

			let description = "";

			switch (true) {
				case (avg >= 94 && avg <= 100):
					description = "Excellent";
					break;

				 case (avg >= 87 && avg < 94):
            description = "Above Satisfactory";
            	 break;
            	  case (avg >= 80 && avg < 87):
            description = "Satisfactory";
            break;
        case (avg >= 75 && avg < 80):
            description = "Needs Improvement";
            break;
        case (avg >= 70 && avg < 75):
            description = "Poor";
            break;
             default:
            description = "Invalid grade input.";


			}

			document.getElementById("result").innerHTML = 
        `Final Grade: ${avg.toFixed(2)} - ${description}`;
}

	</script>
		



</body>
</html>
